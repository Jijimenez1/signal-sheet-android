name: Update prices

# Every 30 minutes while the US market is open (13:30–20:00 UTC), plus once after the close.
on:
  schedule:
    - cron: "5,35 13-20 * * 1-5"
    - cron: "20 21 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/prices.yml", "tools/fetch_prices.py", "docs/data/app.json"]

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python3 tools/fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.name "Signal Sheet bot"
          git config user.email "Jijimenez1@users.noreply.github.com"
          git add docs/data/history.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update prices"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
