name: Update stock universe

# Daily price files for every US stock over $1B plus major ETFs, published to the orphan
# "data" branch (force-pushed each run, so the repo never grows).
on:
  # Once per trading day: the first price-feed run that finishes after 4:15 PM New York time
  # starts this job (GitHub's own timer proved hours late, and extra runs got us blocked).
  workflow_run:
    workflows: ["Update prices"]
    types: [completed]
  workflow_dispatch:
    inputs:
      limit:
        description: "Only fetch this many tickers (0 = all)"
        default: "0"
  push:
    branches: [main]
    paths: [".github/workflows/universe.yml", "tools/fetch_universe.py", "tools/extras.py"]

permissions:
  contents: write

concurrency:
  group: universe
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Is today's data already out?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth 1 origin data && LAST=$(git log -1 --format=%ct FETCH_HEAD) || LAST=0
          python3 - "$LAST" >> "$GITHUB_OUTPUT" <<'PY'
          import sys, datetime as dt
          from zoneinfo import ZoneInfo
          ny = ZoneInfo("America/New_York"); now = dt.datetime.now(ny)
          cut = now.replace(hour=16, minute=15, second=0, microsecond=0)
          last = dt.datetime.fromtimestamp(int(sys.argv[1]), ny)
          stale = (now - last).total_seconds() > 30 * 3600  # yesterday's run never landed: catch up now
          print("go=1" if (now.weekday() < 5 and now >= cut and last < cut) or stale else "go=0")
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"
      - name: Fetch universe
        if: steps.gate.outputs.go == '1'
        run: |
          git fetch -q --depth 1 origin data && git show FETCH_HEAD:universe.json > "$RUNNER_TEMP/old_universe.json" || true
          python3 tools/fetch_universe.py "$RUNNER_TEMP/u" "${{ github.event.inputs.limit || 0 }}" "$RUNNER_TEMP/old_universe.json"
          if [ -f "$RUNNER_TEMP/u/universe.json" ]; then echo "PUBLISH=1" >> "$GITHUB_ENV"; fi
      - name: Publish data branch
        if: steps.gate.outputs.go == '1' && env.PUBLISH == '1'
        run: |
          cd "$RUNNER_TEMP/u"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Daily prices $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
          echo "published $(ls px | wc -l) price files"
