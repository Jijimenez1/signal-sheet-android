name: Update stock universe

# Daily price files for every US stock over $1B plus major ETFs, published to the orphan
# "data" branch (force-pushed each run, so the repo never grows). Runs about 6:40 PM and
# 10:10 PM New York time on trading days (the second run picks up late-posted closes).
on:
  schedule:
    - cron: "40 23 * * 1-5"
    - cron: "10 3 * * 2-6"
  # GitHub's timer often runs hours late, so also piggyback on the price feed: the first
  # price run after 4:15 PM New York time starts this job if today's data isn't out yet.
  workflow_run:
    workflows: ["Update prices"]
    types: [completed]
  workflow_dispatch:
    inputs:
      limit:
        description: "Only fetch this many tickers (0 = all)"
        default: "0"
  push:
    branches: [main]
    paths: [".github/workflows/universe.yml", "tools/fetch_universe.py", "tools/extras.py"]

permissions:
  contents: write

concurrency:
  group: universe
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Is today's data already out?
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch -q --depth 1 origin data && LAST=$(git log -1 --format=%ct FETCH_HEAD) || LAST=0
          python3 - "$LAST" >> "$GITHUB_OUTPUT" <<'PY'
          import sys, datetime as dt
          from zoneinfo import ZoneInfo
          ny = ZoneInfo("America/New_York"); now = dt.datetime.now(ny)
          cut = now.replace(hour=16, minute=15, second=0, microsecond=0)
          last = dt.datetime.fromtimestamp(int(sys.argv[1]), ny)
          print("go=1" if now.weekday() < 5 and now >= cut and last < cut else "go=0")
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"
      - name: Fetch universe
        if: steps.gate.outputs.go == '1'
        run: python3 tools/fetch_universe.py "$RUNNER_TEMP/u" "${{ github.event.inputs.limit || 0 }}"
      - name: Publish data branch
        if: steps.gate.outputs.go == '1'
        run: |
          cd "$RUNNER_TEMP/u"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Daily prices $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
          echo "published $(ls px | wc -l) price files"
