name: Build Signal Sheet APK

on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build signed APK
        run: gradle assembleRelease --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk SignalSheet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SignalSheet-apk
          path: SignalSheet.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Signal Sheet 1.${{ github.run_number }}
          make_latest: "true"
          body: |
            Download **SignalSheet.apk** below, open it on your Android phone, and tap Install.
            No account or sign-in needed.
          files: SignalSheet.apk
